# ============================================
# 网工学习笔记 - 主题配置
# 参照拾壹博客设计风格
# ============================================

# --------------- 导航菜单 ---------------
menu:
  文章:
    归档: /archives/ || anzhiyu-icon-box-archive
    分类: /categories/ || anzhiyu-icon-shapes
    标签: /tags/ || anzhiyu-icon-tags
  关于:
    关于我: /about/ || anzhiyu-icon-user
    留言板: /comment/ || anzhiyu-icon-envelope

# --------------- 主题色（拾壹博客风格蓝靛色系）---------------
theme_color:
  enable: true
  main: "#4A5BDB"
  dark_main: "#7B8CFF"
  paginator: "#4A5BDB"
  text_selection: "#4A5BDB"
  link_color: "#4A5BDB"
  meta_color: "#666"
  hr_color: "#4A5BDB23"
  code_foreground: "#fff"
  code_background: "var(--anzhiyu-code-stress)"
  toc_color: "#4A5BDB"
  scrollbar_color: "var(--anzhiyu-scrollbar)"
  meta_theme_color_light: "#f5f7ff"
  meta_theme_color_dark: "#18171d"

# --------------- 显示模式 ---------------
display_mode: light

# --------------- 首页设置 ---------------
index_post_content:
  method: 3
  length: 300

# 文章双栏卡片式布局
article_double_row: true

# --------------- 文章元信息 ---------------
post_meta:
  page:
    date_type: created
    date_format: simple
    categories: true
    tags: true
    label: false
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true
    unread: false

# --------------- 主页顶部 ---------------
index_site_info_top: 38%
index_top_img_height: 420px
index_img: false

# --------------- 代码块 ---------------
highlight_theme: mac light
highlight_copy: true
highlight_lang: true
highlight_shrink: false
code_word_wrap: false

# --------------- 搜索 ---------------
local_search:
  enable: true
  preload: false
  CDN:

# --------------- 侧边栏（拾壹博客风格）---------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true

  # 作者卡片
  card_author:
    enable: true
    description: >
      <div style="line-height:1.6;margin:0.4rem 0;text-align:center;color:rgba(255,255,255,0.85);">
      网络工程师 / 技术分享者<br>
      <span style="font-size:12px;opacity:0.6;">路由交换 · 网络安全 · 自动化运维</span>
      </div>
    name_link: /

  # 最新文章
  card_recent_post:
    enable: true
    limit: 5
    sort: date

  # 分类卡片
  card_categories:
    enable: true
    limit: 8
    expand: none

  # 标签卡片
  card_tags:
    enable: true
    limit: 30
    color: true

  # 归档卡片
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 6

  # 网站信息卡片
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# --------------- 头像 ---------------
avatar:
  img: https://bu.dusays.com/2023/04/27/64496e511b09c.jpg
  effect: true

# 加载动画
preloader:
  enable: true
  source: 3
  avatar: https://npm.elemecdn.com/anzhiyu-blog-static@1.0.4/img/avatar.jpg

# 网站图标
favicon: /favicon.ico

# --------------- 社交图标 ---------------
social:
  GitHub: https://github.com/wunanyoumu || anzhiyu-icon-github

# --------------- 文章封面 ---------------
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: left
  default_cover:
    # - /img/default_cover.jpg

# --------------- 目录 ---------------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false

# --------------- 版权 ---------------
post_copyright:
  enable: true
  decode: false
  location: 长沙
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# --------------- 赞赏 ---------------
reward:
  enable: false

# --------------- 相关文章 ---------------
related_post:
  enable: true
  limit: 6

# --------------- 分页 ---------------
post_pagination: 2

# --------------- 底部 ---------------
footer:
  owner:
    enable: true
    since: 2025
  footerBar:
    enable: true
    authorLink: /
    linkList:
      - link: https://hexo.io
        text: Hexo
      - link: https://github.com/anzhiyu-c/hexo-theme-anzhiyu
        text: 主题
  socialBar:
    enable: false

# 运行时间
runtimeshow:
  enable: true
  publish_date: 5/31/2025 00:00:00

# --------------- 移动端侧栏 ---------------
sidebar:
  site_data:
    archive: true
    tag: true
    category: true
  menus_items: true
  tags_cloud: true
  display_mode: true
  nav_menu_project: false

# --------------- 美化 ---------------
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: "#4A5BDB"

hr_icon:
  enable: true
  icon: '\f0c4'

# --------------- 特效（简洁为主）---------------
canvas_ribbon:
  enable: false

canvas_nest:
  enable: false

fireworks:
  enable: false

click_heart:
  enable: false

# --------------- 404 ---------------
error_404:
  enable: true
  subtitle: "文章走丢了？试试站内搜索~"
  background: https://bu.dusays.com/2023/05/08/645907596997d.gif

# --------------- Share ---------------
sharejs:
  enable: true
  sites: wechat,weibo,qq

# --------------- 副标题（打字效果）---------------
subtitle:
  enable: true
  effect: true
  startDelay: 300
  typeSpeed: 150
  backSpeed: 50
  loop: true
  source: false
  sub:
    - 学习笔记 · 持续更新
    - 路由交换 / 网络安全 / 自动化运维
